version: '3.9'

services:
  evolution-api:
    # Pinned version: "latest" auto-updates on restart and breaking Evolution
    # changes have silently broken pairing before. Upgrade deliberately by
    # bumping this tag after testing.
    image: evoapicloud/evolution-api:v2.3.7
    environment:
      - DATABASE_PROVIDER=postgresql
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://host.docker.internal:8000/api/webhooks/evolution
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=true
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./evolution.env
    volumes:
      - evolution_instances:/evolution/instances
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - postgres
      - redis
    networks:
      - evolution-net

  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution123
      POSTGRES_DB: evolution
    ports:
      - "5433:5432"
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    networks:
      - evolution-net

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - evolution_redis_data:/data
    networks:
      - evolution-net

volumes:
  evolution_instances:
  evolution_pgdata:
  evolution_redis_data:

networks:
  evolution-net:
    driver: bridge

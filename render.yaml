services:
  - type: web
    name: crm-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: DB_NAME
        value: whatsapp_crm
      - key: JWT_ALGORITHM
        value: HS256
      - key: AI_PROVIDER
        value: openai
      - key: AWS_REGION
        value: us-east-2
      - key: AWS_BUCKET_NAME
        value: crm-images-2025
      # Secrets — set these manually in the Render Dashboard:
      # MONGO_URL, OPENAI_API_KEY, JWT_SECRET, IMGBB_API_KEY,
      # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
      # DEEPSEEK_API_KEY, ANTHROPIC_API_KEY, GROK_API_KEY,
      # EVOLUTION_API_URL, EVOLUTION_API_KEY, PUBLIC_BASE_URL,
      # TAVILY_API_KEY  ← required for web search (get free key at https://tavily.com)

  - type: web
    name: zilo-qdrant
    env: docker
    dockerfilePath: ./qdrant/Dockerfile
    healthCheckPath: /healthz
    disk:
      name: qdrant-storage
      mountPath: /qdrant/storage
      sizeGB: 10
    envVars:
      - key: QDRANT__SERVICE__HTTP_PORT
        value: 6333
      # Add to backend env manually: QDRANT_URL=http://zilo-qdrant:6333
      # EMBEDDING_MODEL=text-embedding-3-small
      # MEMORY_FLUSH_EVERY=10
      # RAG_SCORE_THRESHOLD=0.72
      # CRITIC_ENABLED=false
    plan: starter

  - type: web
    name: crm-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npx expo export --platform web
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_BACKEND_URL
        value: https://crm-1-pnfo.onrender.com


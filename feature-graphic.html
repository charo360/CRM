<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zilo Feature Graphic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f0f0;
        }
        
        .feature-graphic {
            width: 1024px;
            height: 500px;
            background: linear-gradient(135deg, #2DB843 0%, #1a8f2f 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 0 80px;
        }
        
        /* Decorative circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
        }
        
        .circle-1 {
            width: 400px;
            height: 400px;
            background: white;
            top: -100px;
            right: -100px;
        }
        
        .circle-2 {
            width: 300px;
            height: 300px;
            background: white;
            bottom: -80px;
            left: -80px;
        }
        
        .circle-3 {
            width: 200px;
            height: 200px;
            background: white;
            top: 50%;
            right: 15%;
            transform: translateY(-50%);
        }
        
        /* Content */
        .content {
            position: relative;
            z-index: 2;
            color: white;
            max-width: 700px;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }
        
        .logo-text {
            font-size: 56px;
            font-weight: 900;
            color: #2DB843;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        .app-name {
            font-size: 48px;
            font-weight: 800;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            letter-spacing: -1px;
        }
        
        .tagline {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .features {
            font-size: 20px;
            font-weight: 400;
            opacity: 0.95;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
        }
        
        .ai-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.25);
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="feature-graphic">
        <!-- Decorative elements -->
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
        
        <!-- Main content -->
        <div class="content">
            <div class="logo-container">
                <div class="logo">
                    <span class="logo-text">Z</span>
                </div>
                <div class="app-name">Zilo</div>
            </div>
            
            <div class="tagline">AI-Powered WhatsApp CRM</div>
            
            <div class="features">
                Automate Conversations • Track Sales • Manage Customers
            </div>
            
            <div class="ai-badge">🤖 Powered by Artificial Intelligence</div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zilo Browser Operator</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .title { font-size: 16px; font-weight: 700; color: #60a5fa; margin: 0; }
    .badge {
      font-size: 11px; font-weight: 600; padding: 3px 8px;
      border-radius: 9999px; text-transform: uppercase;
    }
    .badge.connected { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .badge.disconnected { background-color: rgba(239, 68, 68, 0.2); color: #f87171; }
    .hint {
      font-size: 12px; line-height: 1.5; color: #cbd5e1;
      background: #1e293b; border: 1px solid #334155; border-radius: 8px;
      padding: 10px 12px; margin-bottom: 14px;
    }
    .hint strong { color: #f8fafc; }
    .row { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
    .row span { color: #e2e8f0; font-weight: 600; }
    details { margin-bottom: 12px; }
    summary { font-size: 12px; color: #64748b; cursor: pointer; }
    label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin: 10px 0 4px; }
    input {
      width: 100%; background-color: #1e293b; border: 1px solid #475569;
      border-radius: 6px; padding: 8px 10px; color: #f8fafc;
      box-sizing: border-box; font-size: 13px;
    }
    input:focus { outline: none; border-color: #3b82f6; }
    button {
      width: 100%; background-color: #2563eb; color: #fff; border: none;
      border-radius: 6px; padding: 10px; font-size: 13px; font-weight: 600;
      cursor: pointer; margin-top: 8px; transition: background-color 0.2s;
    }
    button:hover { background-color: #1d4ed8; }
    button.secondary { background-color: #334155; }
    button.secondary:hover { background-color: #475569; }
    .footer { font-size: 11px; color: #64748b; text-align: center; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">Zilo Operator</h1>
    <span id="status-badge" class="badge disconnected">Disconnected</span>
  </div>

  <div id="hint" class="hint">
    Open and log into your <strong>Zilo dashboard</strong> in any tab — the operator
    connects automatically. No IDs to enter.
  </div>

  <div class="row">Session user: <span id="user-id">—</span></div>

  <button id="reconnect-btn" class="secondary">Reconnect</button>

  <details>
    <summary>Advanced — self-hosted / local server</summary>
    <label for="server-url">Zilo Server URL</label>
    <input type="text" id="server-url" placeholder="http://localhost:8000">
    <button id="save-server-btn">Save &amp; Connect</button>
  </details>

  <div class="footer">Zilo AI CRM Browser Companion &copy; 2026</div>

  <script src="popup.js"></script>
</body>
</html>

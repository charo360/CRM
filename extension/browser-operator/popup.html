<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zilo Browser Control</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      color: #60a5fa;
      margin: 0;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
    }
    .badge.connected {
      background-color: rgba(34, 197, 94, 0.2);
      color: #4ade80;
    }
    .badge.disconnected {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      background-color: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 8px 10px;
      color: #f8fafc;
      box-sizing: border-box;
      font-size: 13px;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    button {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .footer {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">Zilo Browser</h1>
    <span id="status-badge" class="badge disconnected">Disconnected</span>
  </div>

  <div class="form-group">
    <label for="user-id">Zilo User ID</label>
    <input type="text" id="user-id" placeholder="Enter Zilo User ID...">
  </div>

  <div class="form-group">
    <label for="ws-url">Zilo API Server</label>
    <input type="text" id="ws-url" value="http://localhost:8000">
  </div>

  <button id="connect-btn">Connect Session</button>

  <div class="footer">
    Zilo AI CRM Browser Companion &copy; 2026
  </div>

  <script src="popup.js"></script>
</body>
</html>
